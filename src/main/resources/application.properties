spring.application.name=com.taskmanager
# ─── JWT Configuration ───────────────────────────────────────────────────────
# REQUIRED: Replace this with a real secret in production.
# Generate one with: openssl rand -base64 32
# In production, inject via environment variable: JWT_SECRET
jwt.secret=${JWT_SECRET:your-very-long-dev-secret-key-at-least-32-chars}

# Access token TTL — 15 minutes is standard for mobile apps.
# Flutter's token refresh interceptor handles silent renewal.
jwt.access-token-expiry-seconds=900

# Refresh token TTL — 30 days keeps mobile users logged in comfortably.
# Rotation on every use means a stolen token can only be used once.
jwt.refresh-token-expiry-days=30

# ─── Scheduling ──────────────────────────────────────────────────────────────
# Required for @Scheduled in TokenCleanupScheduler to fire.
# Add @EnableScheduling to Application.java.
spring.task.scheduling.pool.size=2