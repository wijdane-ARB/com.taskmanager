# FILE: application.yml
server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  data:
    web:
      pageable:
        serialization-mode: VIA_DTO
    redis:
      host: localhost
      port: 6379
  application:
    name: taskmanager-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskmanager_db}
    username: ${DB_USERNAME:taskmanager_user}
    password: ${DB_PASSWORD:taskmanager_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TaskManagerHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 25
        default_batch_fetch_size: 100
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ── Mail (verification / password-reset codes) ──────────────────────────
  # Fill in MAIL_USERNAME / MAIL_PASSWORD as environment variables — never
  # commit real SMTP credentials to source control.
  # Gmail example: host smtp.gmail.com, port 587, username = your Gmail
  # address, password = a 16-char Gmail "App Password".
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:placeholder}
    password: ${MAIL_PASSWORD:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── JWT ──────────────────────────────────────────────────────────────────
# FIX: jwt.secret was missing and JwtService's @Value has no default, so the
# app failed at startup. The default below is DEV ONLY — JwtService refuses
# to boot with it under the "prod" profile, so set JWT_SECRET there.
jwt:
  secret: ${JWT_SECRET:your-very-long-dev-secret-key-at-least-32-chars}
  access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY_SECONDS:900}
  refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}

# ── App-specific settings ────────────────────────────────────────────────
app:
  trust-proxy-headers: ${APP_TRUST_PROXY_HEADERS:false}
  trusted-proxy-hops: ${APP_TRUSTED_PROXY_HOPS:1}
  mail:
    from: ${MAIL_FROM:arbwij@gmail.com}
    code-expiry-minutes: 15
  google:
    client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id}
  security:
    # Server-side key for HMAC-ing 6-digit verification/reset codes.
    # DEV default only — set CODE_HMAC_SECRET in every real environment.
    code-hmac-secret: ${CODE_HMAC_SECRET:dev-only-change-me-code-hmac-secret-0123456789}

logging:
  level:
    root: INFO
    com.taskmanager.core: INFO
    org.hibernate.SQL: ERROR
    com.zaxxer.hikari: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.springframework.transaction: WARN
    org.flywaydb: INFO

  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://localhost:8081"