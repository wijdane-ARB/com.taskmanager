# FILE: application.yml
server:
  port: 8080
  error:

spring:
  data:
    redis:
      host: localhost
      port: 6379
  application:
    name: taskmanager-core

  datasource:
    url: jdbc:postgresql://localhost:5433/taskmanager_db
    username: taskmanager_user
    password: taskmanager_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TaskManagerHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      # FIX: must stay "validate", not "update". Hibernate's ddl-auto=update
      # trying to manage schema in parallel with Flyway is what caused the
      # original "column team_id does not exist" corruption — Hibernate ran
      # its own blind ALTER TABLE before Flyway's correctly-ordered V3
      # migration ever got a chance. Flyway is the single source of truth
      # for schema now; Hibernate only verifies entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ── Mail (verification / password-reset codes) ──────────────────────────
  # Fill in MAIL_USERNAME / MAIL_PASSWORD as environment variables — never
  # commit real SMTP credentials to source control.
  # Gmail example: host smtp.gmail.com, port 587, username = your Gmail
  # address, password = a 16-char Gmail "App Password" (not your login
  # password — Gmail rejects plain SMTP auth with regular passwords).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── App-specific settings ────────────────────────────────────────────────
app:
  mail:
    trust-proxy-headers: false
    from: ${MAIL_FROM:no-reply@taskmanager.app}
    code-expiry-minutes: 15

logging:
  level:
    root: WARN
    com.taskmanager.core: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.zaxxer.hikari: INFO
    org.springframework.web: DEBUG
    org.springframework.security: WARN
    org.springframework.transaction: DEBUG
    org.flywaydb: DEBUG   # keep this on until we confirm V1–V4 all apply cleanly

  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8081